sageattention3-blackwell = { workspace = true }
sam3 = { workspace = true }
argostranslate = { git = "https://github.com/argosopentech/argos-translate.git" }
groundingdino = { git = "https://github.com/IDEA-Research/GroundingDINO.git" }


